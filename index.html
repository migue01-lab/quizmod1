<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice Exercises - Module 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .exercise {
            margin-bottom: 25px;
            padding: 20px;
            border-left: 4px solid #3498db;
            background: #ecf0f1;
            border-radius: 4px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            padding: 10px 15px;
            background-color: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.2s;
        }
        .option-btn:hover {
            border-color: #3498db;
            background-color: #f2f9ff;
        }
        .option-btn.selected {
            border-color: #3498db;
            background-color: #3498db;
            color: white;
        }
        button.check-btn {
            padding: 8px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1em;
        }
        button.check-btn:hover {
            background-color: #27ae60;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .reveal { color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h1>English Practice Exercises</h1>
        <p style="text-align: center; color: #555;">Choose the correct option to complete each exercise.</p>

        <div id="exercises-container"></div>
    </div>

    <script>
        const exercises = [
            {
                id: 1,
                prompt: "He is an ____.",
                options: ["doctor", "engineer", "chef", "teacher"],
                answer: "engineer"
            },
            {
                id: 2,
                prompt: "They ____ professional engineers.",
                options: ["is", "am", "are", "do"],
                answer: "are"
            },
            {
                id: 3,
                prompt: "Select the correct question for this answer: <br><em>'She is a doctor.'</em>",
                options: ["What do they do?", "What does she do?", "How old is she?", "Where are you from?"],
                answer: "What does she do?"
            },
            {
                id: 4,
                prompt: "Complete the age question: <br><em>'____ old are you?'</em>",
                options: ["What", "How", "Who", "When"],
                answer: "How"
            }
        ];

        const attempts = {};
        const selectedValues = {};
        const container = document.getElementById("exercises-container");

        exercises.forEach((ex, index) => {
            attempts[ex.id] = 0;
            const div = document.createElement("div");
            div.className = "exercise";
            div.innerHTML = `
                <p><strong>Exercise ${index + 1}:</strong> ${ex.prompt}</p>
                <div class="options-grid">
                    ${ex.options.map(opt => `
                        <button class="option-btn" onclick="selectOption(this, ${ex.id}, '${opt}')">${opt}</button>
                    `).join('')}
                </div>
                <button class="check-btn" onclick="checkAnswer(${ex.id}, '${ex.answer}')">Check</button>
                <div id="feedback-${ex.id}" class="feedback"></div>
            `;
            container.appendChild(div);
        });

        function selectOption(button, id, value) {
            const grid = button.parentElement;
            grid.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            selectedValues[id] = value;
        }

        function checkAnswer(id, correctAnswer) {
            const feedback = document.getElementById(`feedback-${id}`);
            const userSelection = selectedValues[id];

            if (!userSelection) {
                feedback.textContent = "Please select an option first.";
                feedback.className = "feedback incorrect";
                return;
            }

            if (userSelection.toLowerCase() === correctAnswer.toLowerCase()) {
                feedback.textContent = "Correct! Great job!";
                feedback.className = "feedback correct";
                attempts[id] = -1;
            } else {
                attempts[id]++;
                if (attempts[id] === 1) {
                    feedback.textContent = "Incorrect. Try again!";
                    feedback.className = "feedback incorrect";
                } else {
                    feedback.textContent = `Incorrect. The correct answer was: "${correctAnswer}"`;
                    feedback.className = "feedback reveal";
                }
            }
        }
    </script>
</body>
</html>
