<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice Exercises - Module 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.5em;
        }
        .exercise {
            margin-bottom: 25px;
            padding: 20px;
            border-left: 4px solid #3498db;
            background: #ecf0f1;
            border-radius: 4px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            padding: 10px 15px;
            background-color: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }
        .option-btn:hover {
            border-color: #3498db;
            background-color: #f2f9ff;
        }
        .option-btn.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
            font-weight: bold;
        }
        button.check-btn {
            padding: 8px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1em;
        }
        button.check-btn:hover {
            background-color: #27ae60;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .reveal { color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grammar & Vocabulary Practice</h1>
        <p style="text-align: center; color: #555;">Select the correct option for each exercise.</p>

        <div id="exercises-container"></div>
    </div>

    <script>
        const exercises = [
            // Auxiliares (Do / Does)
            {
                id: 1,
                prompt: "What ____ you do?",
                options: ["do", "does", "is", "are"],
                answer: "do"
            },
            {
                id: 2,
                prompt: "What ____ she do?",
                options: ["do", "does", "is", "are"],
                answer: "does"
            },
            {
                id: 3,
                prompt: "What ____ they do?",
                options: ["do", "does", "is", "are"],
                answer: "do"
            },
            // Pronombres y Verbo To Be
            {
                id: 4,
                prompt: "____ am an English teacher.",
                options: ["He", "She", "I", "They"],
                answer: "I"
            },
            {
                id: 5,
                prompt: "They ____ professional engineers.",
                options: ["is", "am", "are", "do"],
                answer: "are"
            },
            {
                id: 6,
                prompt: "She ____ a doctor.",
                options: ["am", "are", "is", "do"],
                answer: "is"
            },
            // Articulo general (solo uno de a/an para repasar)
            {
                id: 7,
                prompt: "Mr. Garcia is ____ English teacher.",
                options: ["a", "an", "the", "---"],
                answer: "an"
            },
            // Estilo analítico tipo ejercicio 10 (profesiones y estructuras)
            {
                id: 8,
                prompt: "He is an ____.",
                options: ["doctor", "engineer", "chef", "teacher"],
                answer: "engineer"
            },
            {
                id: 9,
                prompt: "She works in a hospital. She is a ____.",
                options: ["engineer", "doctor", "artist", "architect"],
                answer: "doctor"
            },
            {
                id: 10,
                prompt: "Select the correct question for this answer: <br><em>'She is a chef.'</em>",
                options: ["What do they do?", "What does she do?", "How old is she?", "Where are you from?"],
                answer: "What does she do?"
            }
        ];

        const attempts = {};
        const selectedValues = {};
        const container = document.getElementById("exercises-container");

        exercises.forEach((ex, index) => {
            attempts[ex.id] = 0;
            const div = document.createElement("div");
            div.className = "exercise";
            div.innerHTML = `
                <p><strong>Exercise ${index + 1}</strong></p>
                <p>${ex.prompt}</p>
                <div class="options">
                    ${ex.options.map(opt => `
                        <button class="option-btn" onclick="selectOption(this, ${ex.id}, '${opt}')">${opt}</button>
                    `).join('')}
                </div>
                <button class="check-btn" onclick="checkAnswer(${ex.id}, '${ex.answer}')">Check</button>
                <div id="feedback-${ex.id}" class="feedback"></div>
            `;
            container.appendChild(div);
        });

        function selectOption(button, id, value) {
            const optionsDiv = button.parentElement;
            optionsDiv.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            selectedValues[id] = value;
        }

        function checkAnswer(id, correctAnswer) {
            const feedback = document.getElementById(`feedback-${id}`);
            const userSelection = selectedValues[id];

            if (!userSelection) {
                feedback.textContent = "Please select an option first.";
                feedback.className = "feedback incorrect";
                return;
            }

            if (userSelection.toLowerCase() === correctAnswer.toLowerCase()) {
                feedback.textContent = "Correct! Great job!";
                feedback.className = "feedback correct";
                attempts[id] = -1;
            } else {
                attempts[id]++;
                if (attempts[id] === 1) {
                    feedback.textContent = "Incorrect. Try again!";
                    feedback.className = "feedback incorrect";
                } else {
                    feedback.textContent = `Incorrect. The correct answer was: "${correctAnswer}"`;
                    feedback.className = "feedback reveal";
                }
            }
        }
    </script>
</body>
</html>
